<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b2a21">
<title>چهار برگ 🃏</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<style>
:root{--felt-0:#0b2a21;--felt-1:#113a2d;--felt-2:#18493a;--line:#2b5f4d;--ivory:#f1ece0;--dim:#9fb8aa;--heart:#f0605d;--brass:#d9b45c;--brass-ink:#2a2108;--danger:#ff8a80;--primary:var(--brass);--text-main:var(--ivory);--text-muted:var(--dim)}
html{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Vazirmatn',sans-serif;background:var(--felt-0);color:var(--ivory);min-height:100vh;line-height:1.6;padding-bottom:104px}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app-container{max-width:520px;margin:0 auto;padding:20px 16px}
.glass{background:var(--felt-1);border:1px solid var(--line);border-radius:14px}
header{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:20px}
h1{font-size:28px;font-weight:800;display:flex;align-items:center;gap:12px}
.suits{display:flex;gap:3px;font-size:15px;direction:ltr;line-height:1}
.suits i{font-style:normal;color:var(--ivory)}.suits i.r{color:var(--heart)}
.subtitle{font-size:13px;color:var(--brass);font-weight:600}
.admin-icon{position:absolute;left:0;top:4px;min-height:32px;background:none;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:0 12px;font:inherit;font-size:12px;cursor:pointer}
.tab-bar{display:flex;border-bottom:1px solid var(--line);margin-bottom:20px}
.tab{flex:1;min-height:46px;background:none;border:none;color:var(--dim);font:inherit;font-size:14px;font-weight:600;cursor:pointer;position:relative}
.tab svg{display:none}.tab.active{color:var(--ivory)}
.tab.active::after{content:'';position:absolute;inset-inline:18%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--brass)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.team-card{position:relative;overflow:hidden;padding:16px 12px 14px;text-align:center;border-top:3px solid var(--suit)}
#card-0{--suit:var(--heart)}#card-1{--suit:var(--ivory)}
.team-card::before{content:'♥';position:absolute;left:-6px;bottom:-22px;font-size:96px;line-height:1;color:var(--suit);opacity:.07;pointer-events:none}
#card-1::before{content:'♠'}
.team-card.winner{border-color:var(--brass)}
.team-name-input{width:100%;background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;color:var(--ivory);font:inherit;font-size:15px;font-weight:600;text-align:center;padding:2px 0 6px;margin-bottom:10px}
.team-name-input:focus{outline:none;border-bottom-color:var(--brass)}
.total{font-size:64px;font-weight:800;line-height:1.1;color:var(--suit);font-variant-numeric:tabular-nums}
.winner .total{color:var(--brass)}
.progress-bg{position:relative;height:8px;margin:26px 4px 14px;background:var(--felt-0);border-radius:999px}
.progress-fill{height:100%;width:0;background:var(--suit);border-radius:999px;transition:width .6s ease}
.progress-bg::before{content:'۸۰';position:absolute;top:-19px;right:calc(76.92% - 1em);width:2em;text-align:center;font-size:11px;color:var(--brass)}
.progress-bg::after{content:'';position:absolute;top:-5px;bottom:-5px;right:76.92%;width:2px;margin-right:-1px;background:var(--brass);border-radius:1px}
.inp-row{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--felt-0);border-radius:12px;padding:4px}
.inp-row button{width:44px;height:44px;border:none;border-radius:10px;background:var(--felt-2);color:var(--ivory);font-size:22px;cursor:pointer}
.inp-row button:active{background:var(--line)}
.set-inp{width:48px;text-align:center;font:inherit;font-size:20px;font-weight:700;border:none;background:none;color:var(--ivory);outline:none}
.rule-note{font-size:12px;color:var(--dim);text-align:center;margin-bottom:16px}
.player-select-section{margin-bottom:16px}
.player-teams-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.player-team-col{padding:10px;border:1px solid var(--line);border-radius:12px}
.player-team-label{font-size:12px;color:var(--dim);font-weight:600;margin-bottom:8px;text-align:center}
.player-chip{display:flex;align-items:center;justify-content:space-between;background:var(--felt-2);border-radius:8px;padding:6px 10px;margin-bottom:6px;font-size:14px;font-weight:600}
.player-chip button{background:none;border:none;color:var(--danger);font-size:20px;cursor:pointer;min-width:28px;min-height:28px}
.add-player-btn{width:100%;min-height:40px;background:none;border:1px dashed var(--dim);border-radius:8px;color:var(--ivory);font:inherit;font-size:13px;cursor:pointer}
.controls{display:flex;gap:10px;margin-bottom:24px}
.ctrl-btn{flex:1;min-height:44px;border:1px solid var(--line);border-radius:10px;background:none;color:var(--ivory);font:inherit;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.ctrl-btn:active{background:var(--felt-1)}.ctrl-btn.danger{color:var(--danger)}
.ctrl-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sec-title{font-size:15px;font-weight:700;margin-bottom:10px}
.sets-list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.round-row{display:grid;grid-template-columns:64px 1fr 1fr;padding:10px 8px;border-bottom:1px solid var(--line);text-align:center;font-size:14px}
.round-row:last-child{border-bottom:none}
.rounds-header{background:var(--felt-1);color:var(--dim);font-size:12px;font-weight:600}
.rn{font-size:12px;color:var(--dim);display:flex;align-items:center;justify-content:center}
.score-val{font-weight:700;font-size:16px}.running{display:block;font-size:11px;color:var(--dim)}
.winner-msg{text-align:center;padding:14px;border-color:var(--brass);color:var(--brass);font-weight:600;margin-bottom:16px}
.fab-container{position:fixed;inset-inline:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--felt-0);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:50}
.fab{width:100%;max-width:488px;min-height:52px;border:none;border-radius:12px;background:var(--brass);color:var(--brass-ink);font:inherit;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.fab:active{transform:scale(.98)}
.fab svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.overlay{position:fixed;inset:0;background:rgba(4,16,12,.75);z-index:999;display:none;align-items:center;justify-content:center;padding:16px}
.confirm-box{width:100%;max-width:340px;padding:22px 20px;text-align:center}
.confirm-box p{font-size:15px;margin-bottom:20px;line-height:1.8;white-space:pre-line}
.confirm-btns{display:flex;gap:10px}
.confirm-btns button{flex:1;min-height:44px;border-radius:10px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;border:none}
.confirm-btns .yes{background:var(--brass);color:var(--brass-ink)}.confirm-btns .no{background:var(--felt-2);color:var(--ivory)}
.player-picker{position:fixed;inset:0;background:rgba(4,16,12,.75);z-index:1000;display:none;align-items:flex-end;justify-content:center}
.player-picker-box{width:100%;max-width:520px;background:var(--felt-1);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom));max-height:70vh;overflow-y:auto}
.player-picker-title{font-size:16px;font-weight:700;margin-bottom:12px;text-align:center}
.player-list-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.player-list-item span{font-size:15px;font-weight:600}
.pick-btn{min-height:36px;background:var(--brass);color:var(--brass-ink);border:none;border-radius:8px;padding:0 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.picker-cancel{width:100%;min-height:44px;margin-top:6px;background:none;border:none;color:var(--dim);font:inherit;font-size:14px;cursor:pointer}
.chart-container{padding:16px;margin-bottom:20px;display:flex;flex-direction:column;gap:10px}
.chart-bar-wrap{display:flex;align-items:center;gap:10px}
.chart-label{width:72px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-track{flex:1;height:10px;background:var(--felt-0);border-radius:999px;overflow:hidden}
.chart-fill{height:100%;background:var(--brass);border-radius:999px;transition:width .8s ease}
.game-card{padding:14px;margin-bottom:12px;border-inline-start:4px solid var(--line)}
.game-card.win-0{border-inline-start-color:var(--heart)}.game-card.win-1{border-inline-start-color:var(--ivory)}
.game-card-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--dim);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.game-score-row{display:flex;align-items:center;justify-content:space-between}
.team-block{flex:1;text-align:center}.tname{font-size:13px;color:var(--dim);margin-bottom:2px}
.tscore{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.gwinner .tscore{color:var(--brass)}.gwinner .tname{color:var(--ivory)}
.vs-badge{font-size:11px;color:var(--dim);padding:0 8px}
.win-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brass);margin-inline-start:6px}
.delete-game-btn{display:none;min-height:32px;background:none;border:1px solid var(--danger);color:var(--danger);border-radius:8px;padding:0 12px;font:inherit;font-size:12px;cursor:pointer;margin-bottom:10px}
.admin-mode .delete-game-btn{display:inline-block}
.empty{text-align:center;color:var(--dim);padding:32px 16px;font-size:14px}
.stats-player-card{padding:14px 16px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.stats-player-name{font-size:16px;font-weight:700}.stats-player-meta{font-size:12px;color:var(--dim);margin-top:2px}
.stats-badge{border:1px solid var(--brass);color:var(--brass);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700}
.stats-detail{padding:16px;margin-bottom:12px}
.stats-detail-header{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.back-btn{min-width:44px;min-height:44px;background:none;border:none;color:var(--brass);font-size:22px;cursor:pointer}
.stats-detail-name{font-size:18px;font-weight:800}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat-box{background:var(--felt-0);border-radius:10px;padding:12px 6px;text-align:center}
.stat-box-val{font-size:28px;font-weight:800}.stat-box-lbl{font-size:11px;color:var(--dim)}
.partner-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.partner-row:last-child{border-bottom:none}.partner-name{font-size:14px;font-weight:600}
.partner-stat{font-size:12px;color:var(--dim)}.partner-wins{font-size:13px;font-weight:700;color:var(--brass)}
.admin-panel{padding:16px}.admin-panel-title{font-size:16px;font-weight:700;margin-bottom:14px}
.admin-input-row{display:flex;gap:8px;margin-bottom:14px}
.admin-input,.login-input{background:var(--felt-0);border:1px solid var(--line);border-radius:10px;color:var(--ivory);font:inherit;outline:none}
.admin-input{flex:1;min-height:44px;padding:0 14px;font-size:14px}
.admin-input:focus,.login-input:focus,.admin-edit-input:focus{border-color:var(--brass)}
.admin-add-btn,.login-btn{min-height:44px;background:var(--brass);color:var(--brass-ink);border:none;border-radius:10px;padding:0 18px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.admin-players-scroll{max-height:320px;overflow-y:auto}
.admin-player-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.admin-player-name{flex:1;font-size:14px;font-weight:600}
.admin-edit-input{flex:1;min-height:36px;background:var(--felt-0);border:1px solid var(--brass);border-radius:8px;padding:0 10px;color:var(--ivory);font:inherit;font-size:14px;outline:none}
.admin-row-btns{display:flex;gap:6px}
.admin-edit-btn,.admin-save-btn,.admin-del-btn{min-height:34px;background:none;border-radius:8px;padding:0 12px;font:inherit;font-size:12px;cursor:pointer}
.admin-edit-btn{border:1px solid var(--line);color:var(--ivory)}.admin-save-btn{border:1px solid var(--brass);color:var(--brass)}.admin-del-btn{border:1px solid var(--danger);color:var(--danger)}
.admin-logout{width:100%;min-height:44px;margin-top:16px;background:none;border:1px solid var(--line);border-radius:10px;color:var(--dim);font:inherit;font-size:14px;cursor:pointer}
.login-box{padding:28px 20px;text-align:center;max-width:320px;margin:24px auto 0}
.login-title{font-size:18px;font-weight:700;margin-bottom:18px}
.login-input{width:100%;min-height:48px;padding:0 14px;font-size:16px;margin-bottom:12px;text-align:center}
.login-btn{width:100%;min-height:48px;font-size:15px}
.login-err{color:var(--danger);font-size:13px;margin-top:8px;min-height:20px}
.loading{text-align:center;padding:28px;color:var(--dim);font-size:14px}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-inline-end:8px}
@keyframes spin{to{transform:rotate(360deg)}}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
header{flex-direction:row;justify-content:space-between;align-items:center;margin-bottom:18px}
.subtitle{background:var(--felt-2);border:1px solid var(--line);border-radius:999px;padding:3px 14px;font-size:12px}
body{padding-bottom:150px}

.tab.active{color:var(--brass)}
.tab.active::after{inset-inline:0;top:-1px;bottom:auto;height:3px;border-radius:0 0 3px 3px}
.fab-container{bottom:calc(60px + env(safe-area-inset-bottom));background:none;border:none;pointer-events:none;padding:0 16px 12px}

#view-current,#view-history,#view-stats,#view-admin{animation:fadein .25s ease}

.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.metric{background:var(--felt-1);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.metric b{display:block;font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric span{font-size:11px;color:var(--dim)}
.chart-label{width:104px;display:flex;align-items:center;gap:8px}
.rank{width:20px;height:20px;border-radius:50%;background:var(--felt-2);font-size:11px;display:inline-flex;align-items:center;justify-content:center;color:var(--brass);flex:none}
.game-card-header{font-weight:600}
.stats-player-card{gap:12px}.sp-info{flex:1;min-width:0}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--felt-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:none}
.ring{--s:46px;position:relative;width:var(--s);height:var(--s);border-radius:50%;background:conic-gradient(var(--brass) calc(var(--p)*1%),var(--felt-0) 0);display:flex;align-items:center;justify-content:center;flex:none}
.ring::before{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--felt-1)}
.ring b{position:relative;font-size:12px;font-weight:700}

.pbar i{display:block;height:100%;background:var(--brass);border-radius:2px}

body{background:radial-gradient(130% 60% at 50% 0%,#1d6048 0%,#0e3326 45%,#071d16 100%) fixed,var(--felt-0)}

.rounds-header{background:rgba(0,0,0,.25)}

.game-card{border-inline-start-width:5px}
.tscore{font-size:34px;font-weight:900}
.vs-badge{width:30px;height:30px;border-radius:50%;background:var(--felt-0);display:flex;align-items:center;justify-content:center;padding:0;font-weight:700}
.avatar{background:linear-gradient(135deg,#276b57,#113a2d);color:var(--brass);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.stats-player-card:active{transform:scale(.985)}
.stat-box{background:rgba(0,0,0,.25);border:1px solid var(--line)}.stat-box-val{font-size:32px;font-weight:900;color:var(--brass)}
.ring{box-shadow:0 0 14px rgba(217,180,92,.2)}.ring::before{background:#113a2d}
.confirm-box,.player-picker-box{box-shadow:0 24px 60px rgba(0,0,0,.6)}
.winner-msg{background:linear-gradient(180deg,rgba(217,180,92,.2),rgba(217,180,92,.06));font-size:16px;font-weight:800}
</style>
</head>
<body>
<div class="app-container">
  <header>
    <h1><span class="suits" aria-hidden="true"><i>♠</i><i class="r">♥</i><i class="r">♦</i><i>♣</i></span>چهار برگ</h1>
    <div class="subtitle" id="game-subtitle">بازی اول</div>
      </header>

  <div class="tab-bar">
    <button class="tab active" id="tab-current" onclick="showTab('current')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      جاری
    </button>
    <button class="tab" id="tab-history" onclick="showTab('history')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
      تاریخچه
    </button>
    <button class="tab" id="tab-stats" onclick="showTab('stats')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      آمار
    </button>
    <button class="tab" id="tab-admin" onclick="showTab('admin')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>مدیریت</button>
  </div>

  <!-- جاری -->
  <div id="view-current">
    <div id="winner-msg" style="display:none" class="winner-msg glass"></div>
    <div class="player-select-section">
      <div class="sec-title">بازیکن‌های این بازی</div>
      <div class="player-teams-grid">
        <div class="player-team-col">
          <div class="player-team-label" id="label-team0">تیم ما</div>
          <div id="team0-players"></div>
          <button class="add-player-btn" onclick="openPicker(0)">+ افزودن</button>
        </div>
        <div class="player-team-col">
          <div class="player-team-label" id="label-team1">تیم حریف</div>
          <div id="team1-players"></div>
          <button class="add-player-btn" onclick="openPicker(1)">+ افزودن</button>
        </div>
      </div>
    </div>
    <div class="teams">
      <div class="team-card glass" id="card-0">
        <input class="team-name-input" id="name-0" value="تیم ما" oninput="renderGame();document.getElementById('label-team0').textContent=this.value||'تیم ما'">
        <div class="total" id="total-0" data-val="0">0</div>
        <div class="progress-bg"><div class="progress-fill" id="prog-0"></div></div>
        <div class="inp-row">
          <button onclick="adj(0,-5)">−</button>
          <input class="set-inp" id="inp-0" type="number" value="0" step="5" onfocus="this.select()">
          <button onclick="adj(0,5)">+</button>
        </div>
      </div>
      <div class="team-card glass" id="card-1">
        <input class="team-name-input" id="name-1" value="تیم حریف" oninput="renderGame();document.getElementById('label-team1').textContent=this.value||'تیم حریف'">
        <div class="total" id="total-1" data-val="0">0</div>
        <div class="progress-bg"><div class="progress-fill" id="prog-1"></div></div>
        <div class="inp-row">
          <button onclick="adj(1,-5)">−</button>
          <input class="set-inp" id="inp-1" type="number" value="0" step="5" onfocus="this.select()">
          <button onclick="adj(1,5)">+</button>
        </div>
      </div>
    </div>
    <p class="rule-note">خط ۸۰ روی نوار امتیاز: از اینجا به بعد سور حساب نمی‌شود. بازی تا ۱۰۴ ادامه دارد.</p>
    <div class="controls">
      <button class="ctrl-btn" onclick="undoSet()">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        برگشت ست
      </button>
      <button class="ctrl-btn danger" onclick="askReset()">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        ریست بازی
      </button>
    </div>
    <div class="sec-title">تاریخچه ست‌ها</div>
    <div class="sets-list" id="sets-list"></div>
  </div>

  <!-- تاریخچه -->
  <div id="view-history" style="display:none">
    <div id="overall-section"></div>
    <div class="sec-title" style="margin-top:1.5rem">ریز نتایج بازی‌ها</div>
    <div id="games-list"></div>
  </div>

  <!-- آمار -->
  <div id="view-stats" style="display:none">
    <div id="stats-list-view">
      <div class="sec-title">آمار بازیکن‌ها</div>
      <div id="stats-players-container"><div class="loading"><span class="spinner"></span> در حال بارگذاری...</div></div>
    </div>
    <div id="stats-detail-view" style="display:none"></div>
  </div>

  <!-- ادمین -->
  <div id="view-admin" style="display:none">
    <div id="admin-login-view">
      <div class="login-box glass">
        <div class="login-title">ورود ادمین</div>
        <input class="login-input" type="password" id="admin-pass-input" placeholder="رمز عبور" onkeydown="if(event.key==='Enter')doAdminLogin()">
        <button class="login-btn" onclick="doAdminLogin()">ورود</button>
        <div class="login-err" id="login-err"></div>
      </div>
    </div>
    <div id="admin-panel-view" style="display:none">
      <div class="admin-panel glass">
        <div class="admin-panel-title">مدیریت بازیکن‌ها</div>
        <div class="admin-input-row">
          <input class="admin-input" id="new-player-name" placeholder="نام بازیکن جدید" onkeydown="if(event.key==='Enter')addPlayer()">
          <button class="admin-add-btn" onclick="addPlayer()">افزودن</button>
        </div>
        <div class="admin-players-scroll" id="admin-players-list">
          <div class="loading"><span class="spinner"></span></div>
        </div>
        <button class="admin-logout" onclick="adminLogout()">خروج از ادمین</button>
      </div>
    </div>
  </div>
</div>

<!-- FAB -->
<div class="fab-container" id="fab-container">
  <button class="fab" id="fab-action" onclick="handleFabClick()">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    <span id="fab-text">ثبت امتیاز ست</span>
  </button>
</div>

<!-- Confirm Modal -->
<div class="overlay" id="modal-overlay">
  <div class="confirm-box glass">
    <p id="confirm-text"></p>
    <div class="confirm-btns">
      <button class="yes" id="confirm-yes">بله، مطمئنم</button>
      <button class="no" onclick="cancelConfirm()">انصراف</button>
    </div>
  </div>
</div>

<!-- Player Picker -->
<div class="player-picker" id="player-picker">
  <div class="player-picker-box">
    <div class="player-picker-title" id="picker-title">انتخاب بازیکن</div>
    <div id="picker-list"></div>
    <button class="picker-cancel" onclick="closePicker()">انصراف</button>
  </div>
</div>

<script>
const API = 'https://4bargh-api.zulair.workers.dev';
const WIN = 104;
const state = {
  scores:[0,0], sets:[], gameOver:false, gameNum:1,
  teamPlayers:[[],[]], adminPassword:null, isAdmin:false
};
let allPlayers = [];
let pickerTeam = 0;

function toFa(n){return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);}
function name(i){return document.getElementById('name-'+i).value.trim()||'تیم '+(i+1);}

function animateValue(obj,start,end,dur){
  let t0=null;
  const step=(t)=>{
    if(!t0)t0=t;
    const p=Math.min((t-t0)/dur,1);
    const e=1-Math.pow(1-p,4);
    obj.innerHTML=Math.floor(e*(end-start)+start);
    if(p<1)requestAnimationFrame(step);
    else{obj.innerHTML=end;obj.dataset.val=end;}
  };
  requestAnimationFrame(step);
}

function adj(i,d){
  const inp=document.getElementById('inp-'+i);
  inp.value=Math.max(0,(parseInt(inp.value)||0)+d);
}

// ── API ────────────────────────────────────────────
async function apiGet(path){
  const r=await fetch(API+path);
  return r.json();
}
async function apiPost(path,body){
  const h={'Content-Type':'application/json'};
  if(state.adminPassword)h['X-Admin-Password']=state.adminPassword;
  const r=await fetch(API+path,{method:'POST',headers:h,body:JSON.stringify(body)});
  return r.json();
}
async function apiPut(path,body){
  const h={'Content-Type':'application/json'};
  if(state.adminPassword)h['X-Admin-Password']=state.adminPassword;
  const r=await fetch(API+path,{method:'PUT',headers:h,body:JSON.stringify(body)});
  return r.json();
}
async function apiDelete(path){
  const h={};
  if(state.adminPassword)h['X-Admin-Password']=state.adminPassword;
  const r=await fetch(API+path,{method:'DELETE',headers:h});
  return r.json();
}

// ── Players ────────────────────────────────────────
async function loadPlayers(){
  try{allPlayers=await apiGet('/players');}catch(e){allPlayers=[];}
  renderTeamPlayers();
}

function renderTeamPlayers(){
  [0,1].forEach(t=>{
    const el=document.getElementById('team'+t+'-players');
    el.innerHTML=state.teamPlayers[t].map(p=>
      `<div class="player-chip"><span>${p.name}</span><button onclick="removePlayer(${t},${p.id})">×</button></div>`
    ).join('');
  });
}

function removePlayer(team,id){
  state.teamPlayers[team]=state.teamPlayers[team].filter(p=>p.id!==id);
  renderTeamPlayers();
}

function openPicker(team){
  if(state.teamPlayers[team].length>=2)return;
  pickerTeam=team;
  document.getElementById('picker-title').textContent=`انتخاب بازیکن برای ${name(team)}`;
  const already=[...state.teamPlayers[0],...state.teamPlayers[1]].map(p=>p.id);
  const available=allPlayers.filter(p=>!already.includes(p.id));
  const list=document.getElementById('picker-list');
  if(!available.length){
    list.innerHTML='<div class="empty">بازیکنی باقی نمانده<br><small>از پنل ادمین بازیکن اضافه کنید</small></div>';
  } else {
    list.innerHTML=available.map(p=>
      `<div class="player-list-item"><span>${p.name}</span><button class="pick-btn" onclick="pickPlayer(${p.id},'${p.name.replace(/'/g,"\\'").replace(/"/g,"&quot;")}')">انتخاب</button></div>`
    ).join('');
  }
  document.getElementById('player-picker').style.display='flex';
}

function pickPlayer(id,pname){
  state.teamPlayers[pickerTeam].push({id,name:pname});
  renderTeamPlayers();
  closePicker();
}
function closePicker(){document.getElementById('player-picker').style.display='none';}

// ── Game ───────────────────────────────────────────
function handleFabClick(){
  if(state.gameOver){askSaveGame();}
  else{
    const v=[0,1].map(i=>Math.max(0,parseInt(document.getElementById('inp-'+i).value)||0));
    if(v[0]===0&&v[1]===0)return;
    showConfirm(`ثبت ست؟\n${name(0)}: ${v[0]} | ${name(1)}: ${v[1]}`,()=>{cancelConfirm();addSet();});
  }
}

function addSet(){
  if(state.gameOver)return;
  const v=[0,1].map(i=>Math.max(0,parseInt(document.getElementById('inp-'+i).value)||0));
  if(v[0]===0&&v[1]===0)return;
  state.sets.push([...v]);
  state.scores[0]+=v[0];state.scores[1]+=v[1];
  document.getElementById('inp-0').value=0;document.getElementById('inp-1').value=0;
  if(state.scores[0]>=WIN||state.scores[1]>=WIN)state.gameOver=true;
  renderGame(true);
}

function undoSet(){
  if(!state.sets.length)return;
  const last=state.sets.pop();
  state.scores[0]-=last[0];state.scores[1]-=last[1];
  state.gameOver=false;renderGame(true);
}

function getWinIdx(){
  if(!state.gameOver)return -1;
  if(state.scores[0]>=WIN&&state.scores[1]>=WIN)return state.scores[0]>state.scores[1]?0:1;
  return state.scores[0]>=WIN?0:1;
}

function askReset(){showConfirm('آیا مطمئن هستید؟\nبازی جاری ریست می‌شود.',doReset);}
function doReset(){
  state.scores=[0,0];state.sets=[];state.gameOver=false;state.teamPlayers=[[],[]];
  document.getElementById('inp-0').value=0;document.getElementById('inp-1').value=0;
  cancelConfirm();renderGame(true);renderTeamPlayers();
}

function askSaveGame(){showConfirm('نتیجه ذخیره شود و\nبازی جدید شروع شود؟',doSaveGame);}
async function doSaveGame(){
  cancelConfirm();
  const wi=getWinIdx();
  const t1=state.teamPlayers[0].map(p=>p.id);
  const t2=state.teamPlayers[1].map(p=>p.id);
  if(t1.length&&t2.length){
    try{await apiPost('/games',{team1:t1,team2:t2,team1_score:state.scores[0],team2_score:state.scores[1],winner:wi+1});}
    catch(e){console.error(e);}
  }
  state.gameNum++;
  state.scores=[0,0];state.sets=[];state.gameOver=false;state.teamPlayers=[[],[]];
  document.getElementById('inp-0').value=0;document.getElementById('inp-1').value=0;
  renderGame(true);renderTeamPlayers();
}

function renderGame(animate=false){
  const wi=getWinIdx();
  [0,1].forEach(i=>{
    const el=document.getElementById('total-'+i);
    const old=parseInt(el.dataset.val)||0;
    if(animate&&old!==state.scores[i])animateValue(el,old,state.scores[i],600);
    else{el.textContent=state.scores[i];el.dataset.val=state.scores[i];}
    document.getElementById('card-'+i).className='team-card glass'+(wi===i?' winner':'');
    document.getElementById('prog-'+i).style.width=Math.min(100,(state.scores[i]/WIN)*100)+'%';
  });
  const wm=document.getElementById('winner-msg');
  const fab=document.getElementById('fab-action');
  if(wi>=0){
    wm.style.display='block';
    wm.innerHTML=`<strong>${name(wi)}</strong> برنده بازی ${toFa(state.gameNum)} شد.`;
    document.getElementById('fab-text').textContent='ذخیره و بازی جدید';
    fab.querySelector('svg').innerHTML='<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>';
  } else {
    wm.style.display='none';
    document.getElementById('fab-text').textContent='ثبت امتیاز ست';
    fab.querySelector('svg').innerHTML='<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>';
  }
  document.getElementById('game-subtitle').textContent='بازی '+toFa(state.gameNum);
  const list=document.getElementById('sets-list');
  if(!state.sets.length){list.innerHTML='<div class="empty">هنوز ستی ثبت نشده است</div>';return;}
  let cum=[0,0];
  list.innerHTML=`<div class="round-row rounds-header"><span></span><span>${name(0)}</span><span>${name(1)}</span></div>`
    +state.sets.map((s,i)=>{
      cum[0]+=s[0];cum[1]+=s[1];
      return `<div class="round-row"><span class="rn">ست ${toFa(i+1)}</span>
        <span><span class="score-val">${s[0]}</span><span class="running">${cum[0]}</span></span>
        <span><span class="score-val">${s[1]}</span><span class="running">${cum[1]}</span></span></div>`;
    }).reverse().join('');
}

// ── History ────────────────────────────────────────
async function renderHistory(){
  const glist=document.getElementById('games-list');
  const osec=document.getElementById('overall-section');
  glist.innerHTML='<div class="loading"><span class="spinner"></span> در حال بارگذاری...</div>';
  let games=[];
  try{games=await apiGet('/games');}catch(e){}
  if(!games.length){glist.innerHTML='<div class="empty glass">تاریخچه‌ای موجود نیست</div>';osec.innerHTML='';return;}

  const totals={};let maxWins=0;
  games.forEach(g=>{
    [1,2].forEach(t=>{
      (g.players||[]).filter(p=>p.team===t).forEach(p=>{
        if(!totals[p.name])totals[p.name]={wins:0};
        if(g.winner===t){totals[p.name].wins++;if(totals[p.name].wins>maxWins)maxWins=totals[p.name].wins;}
      });
    });
  });
  const sorted=Object.entries(totals).sort((a,b)=>b[1].wins-a[1].wins);
  osec.innerHTML=`<div class="metrics"><div class="metric"><b>${toFa(games.length)}</b><span>بازی ثبت‌شده</span></div><div class="metric"><b>${toFa(sorted.length)}</b><span>بازیکن</span></div><div class="metric"><b>${sorted[0]?sorted[0][0]:'—'}</b><span>بیشترین برد</span></div></div><div class="chart-container glass">
    <div class="sec-title" style="margin-bottom:5px">نمودار بردها</div>
    ${sorted.map(([n,d],ix)=>`<div class="chart-bar-wrap">
      <div class="chart-label"><span class="rank">${toFa(ix+1)}</span>${n}</div>
      <div class="chart-track"><div class="chart-fill" style="width:${maxWins?(d.wins/maxWins*100):0}%"></div></div>
      <div style="font-size:12px;font-weight:700;width:40px">${toFa(d.wins)} برد</div>
    </div>`).join('')}
  </div>`;

  const adminClass=state.isAdmin?'admin-mode':'';
  glist.innerHTML=games.map(g=>{
    const t1=(g.players||[]).filter(p=>p.team===1).map(p=>p.name).join('، ')||'—';
    const t2=(g.players||[]).filter(p=>p.team===2).map(p=>p.name).join('، ')||'—';
    const winTeam=g.winner===1?t1:t2;
    let d='';
    try{d=new Date(String(g.played_at).replace(' ','T')+'Z').toLocaleString('fa-IR',{timeZone:'Asia/Tehran',dateStyle:'medium',timeStyle:'short'});}catch(e){}
    return `<div class="game-card glass win-${g.winner-1} ${adminClass}">
      <button class="delete-game-btn" onclick="askDeleteGame(${g.id})">حذف</button>
      <div class="game-card-header"><span>${d}</span><span style="color:var(--primary)">${winTeam} برد</span></div>
      <div class="game-score-row">
        <div class="team-block ${g.winner===1?'gwinner':''}">
          <div class="tname">${t1} ${g.winner===1?'<span class="win-dot"></span>':''}</div>
          <div class="tscore">${g.team1_score}</div>
        </div>
        <div class="vs-badge">VS</div>
        <div class="team-block ${g.winner===2?'gwinner':''}">
          <div class="tname">${t2} ${g.winner===2?'<span class="win-dot"></span>':''}</div>
          <div class="tscore">${g.team2_score}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function askDeleteGame(id){
  showConfirm('آیا از حذف این بازی\nمطمئن هستید؟',async()=>{
    cancelConfirm();
    await apiDelete('/games/'+id);
    renderHistory();
  });
}

// ── Stats ──────────────────────────────────────────
async function renderStats(){
  const container=document.getElementById('stats-players-container');
  container.innerHTML='<div class="loading"><span class="spinner"></span> در حال بارگذاری...</div>';
  document.getElementById('stats-list-view').style.display='block';
  document.getElementById('stats-detail-view').style.display='none';
  if(!allPlayers.length){
    try{allPlayers=await apiGet('/players');}catch(e){}
  }
  if(!allPlayers.length){
    container.innerHTML='<div class="empty glass">هنوز بازیکنی ثبت نشده<br><small>از پنل ادمین بازیکن اضافه کنید</small></div>';
    return;
  }
  const statsArr=await Promise.all(allPlayers.map(p=>apiGet('/stats/'+p.id).catch(()=>({total_games:0,wins:0,losses:0,partners:[]}))));
  container.innerHTML='';
  allPlayers.forEach((p,i)=>{
    const s=statsArr[i];
    const wr=s.total_games?Math.round((s.wins/s.total_games)*100):0;
    const div=document.createElement('div');
    div.className='stats-player-card glass';
    div.innerHTML=`<div class="avatar">${p.name.trim().charAt(0)}</div><div class="sp-info">
      <div class="stats-player-name">${p.name}</div>
      <div class="stats-player-meta">${toFa(s.total_games||0)} بازی، ${toFa(s.wins||0)} برد، ${toFa(s.losses||0)} باخت</div>
    </div><div class="ring" style="--p:${wr}"><b>${toFa(wr)}٪</b></div>`;
    div.onclick=()=>showPlayerDetail(p,s);
    container.appendChild(div);
  });
}

function showPlayerDetail(player,stats){
  document.getElementById('stats-list-view').style.display='none';
  const detail=document.getElementById('stats-detail-view');
  detail.style.display='block';
  const wr=stats.total_games?Math.round((stats.wins/stats.total_games)*100):0;
  const partners=stats.partners||[];
  detail.innerHTML=`<div class="stats-detail glass">
    <div class="stats-detail-header">
      <button class="back-btn" onclick="document.getElementById('stats-list-view').style.display='block';document.getElementById('stats-detail-view').style.display='none'">←</button>
      <div class="stats-detail-name">${player.name}</div><div class="ring big" style="--p:${wr}"><b>${toFa(wr)}٪</b></div>
    </div>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-box-val">${toFa(stats.wins||0)}</div><div class="stat-box-lbl">برد</div></div>
      <div class="stat-box"><div class="stat-box-val">${toFa(stats.losses||0)}</div><div class="stat-box-lbl">باخت</div></div>
      <div class="stat-box"><div class="stat-box-val">${toFa(stats.total_games||0)}</div><div class="stat-box-lbl">کل بازی‌ها</div></div>
    </div>
    ${partners.length?`<div class="sec-title">آمار با شریک‌های تیمی</div>
    ${partners.map(p=>`<div class="partner-row">
      <div><div class="partner-name">${p.partner_name}</div>
      <div class="partner-stat">${toFa(p.together)} بازی با هم</div><div class="pbar"><i style="width:${p.together?Math.round(p.wins_together/p.together*100):0}%"></i></div></div>
      <div class="partner-wins">${toFa(p.wins_together)} برد</div>
    </div>`).join('')}`:'<div class="empty">هنوز بازی ثبت‌شده‌ای نیست</div>'}
  </div>`;
}

// ── Admin ──────────────────────────────────────────
async function doAdminLogin(){
  const pass=document.getElementById('admin-pass-input').value;
  if(!pass)return;
  // تست رمز با یه درخواست واقعی
  const testH={'Content-Type':'application/json','X-Admin-Password':pass};
  try{
    const r=await fetch(API+'/players',{method:'POST',headers:testH,body:JSON.stringify({name:'__test__'})});
    const d=await r.json();
    if(d.error==='Unauthorized'){
      document.getElementById('login-err').textContent='رمز اشتباه است';
      return;
    }
    // اگه ساخته شد، پاکش کن
    if(d.ok){
      const pl=await apiGet('/players');
      const t=pl.find(p=>p.name==='__test__');
      if(t){await fetch(API+'/players/'+t.id,{method:'DELETE',headers:{'X-Admin-Password':pass}});}
    }
  }catch(e){}
  state.adminPassword=pass;
  state.isAdmin=true;
  document.getElementById('login-err').textContent='';
  document.getElementById('admin-login-view').style.display='none';
  document.getElementById('admin-panel-view').style.display='block';
  loadAdminPlayers();
}

function adminLogout(){
  state.adminPassword=null;state.isAdmin=false;
  document.getElementById('admin-login-view').style.display='block';
  document.getElementById('admin-panel-view').style.display='none';
  document.getElementById('admin-pass-input').value='';
  showTab('current');
}

async function loadAdminPlayers(){
  const list=document.getElementById('admin-players-list');
  list.innerHTML='<div class="loading"><span class="spinner"></span></div>';
  try{allPlayers=await apiGet('/players');}catch(e){allPlayers=[];}
  if(!allPlayers.length){list.innerHTML='<div class="empty">هنوز بازیکنی ثبت نشده</div>';return;}
  list.innerHTML=allPlayers.map(p=>
    `<div class="admin-player-row" id="row-${p.id}">
      <span class="admin-player-name" id="name-label-${p.id}">${p.name}</span>
      <input class="admin-edit-input" id="edit-inp-${p.id}" value="${p.name}" style="display:none" onkeydown="if(event.key==='Enter')savePlayer(${p.id})">
      <div class="admin-row-btns">
        <button class="admin-edit-btn" id="edit-btn-${p.id}" onclick="startEdit(${p.id})">ویرایش</button>
        <button class="admin-save-btn" id="save-btn-${p.id}" style="display:none" onclick="savePlayer(${p.id})">✓ ذخیره</button>
        <button class="admin-del-btn" onclick="deletePlayer(${p.id})">حذف</button>
      </div>
    </div>`
  ).join('');
}

function startEdit(id){
  document.getElementById('name-label-'+id).style.display='none';
  document.getElementById('edit-inp-'+id).style.display='block';
  document.getElementById('edit-btn-'+id).style.display='none';
  document.getElementById('save-btn-'+id).style.display='block';
  document.getElementById('edit-inp-'+id).focus();
}

async function savePlayer(id){
  const newName=document.getElementById('edit-inp-'+id).value.trim();
  if(!newName)return;
  await apiPut('/players/'+id,{name:newName});
  loadAdminPlayers();
  loadPlayers();
}

async function addPlayer(){
  const inp=document.getElementById('new-player-name');
  const n=inp.value.trim();
  if(!n)return;
  inp.value='';
  await apiPost('/players',{name:n});
  loadAdminPlayers();
  allPlayers=await apiGet('/players');
}

async function deletePlayer(id){
  showConfirm('آیا از حذف این بازیکن\nمطمئن هستید؟',async()=>{
    cancelConfirm();
    await apiDelete('/players/'+id);
    loadAdminPlayers();
    allPlayers=await apiGet('/players');
  });
}

// ── Tabs ───────────────────────────────────────────
function showTab(t){
  ['current','history','stats','admin'].forEach(tab=>{
    document.getElementById('view-'+tab).style.display=tab===t?'block':'none';
    const btn=document.getElementById('tab-'+tab);
    if(btn)btn.className='tab'+(tab===t?' active':'');
  });
  document.getElementById('fab-container').style.display=t==='current'?'flex':'none';
  if(t==='history')renderHistory();
  if(t==='stats')renderStats();
  if(t==='admin'&&state.isAdmin){
    document.getElementById('admin-login-view').style.display='none';
    document.getElementById('admin-panel-view').style.display='block';
    loadAdminPlayers();
  }
}

// ── Confirm ────────────────────────────────────────
function showConfirm(text,action){
  document.getElementById('confirm-text').textContent=text;
  document.getElementById('confirm-yes').onclick=action;
  document.getElementById('modal-overlay').style.display='flex';
}
function cancelConfirm(){document.getElementById('modal-overlay').style.display='none';}

// ── Init ───────────────────────────────────────────
renderGame();
loadPlayers();
</script>
</body>
</html>
