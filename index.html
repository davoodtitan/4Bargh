<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>چهار برگ 🃏</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<style>
  :root {
    --bg-main: #0f172a; --bg-sec: #1e293b; --glass-bg: rgba(30,41,59,0.7);
    --glass-border: rgba(255,255,255,0.08); --text-main: #f8fafc; --text-muted: #94a3b8;
    --primary: #10b981; --primary-glow: rgba(16,185,129,0.4); --danger: #ef4444;
    --accent: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Vazirmatn', sans-serif; background: radial-gradient(circle at top right, var(--bg-sec), var(--bg-main)); color: var(--text-main); min-height: 100vh; padding-bottom: 90px; }
  .glass { background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
  .app-container { max-width: 500px; margin: 0 auto; padding: 1.5rem 1rem; }
  header { display: flex; align-items: center; justify-content: center; flex-direction: column; margin-bottom: 1.5rem; position: relative; }
  h1 { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .subtitle { font-size: 14px; color: var(--primary); margin-top: 4px; font-weight: 600; letter-spacing: 1px; }
  .admin-icon { position: absolute; left: 0; top: 0; background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; font-size: 20px; }

  /* Tabs */
  .tab-bar { display: flex; background: rgba(0,0,0,0.2); border-radius: 14px; padding: 5px; margin-bottom: 1.5rem; position: relative; gap: 2px; }
  .tab { flex: 1; padding: 10px 4px; text-align: center; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-muted); border: none; background: transparent; font-family: inherit; transition: color 0.3s; z-index: 1; display: flex; justify-content: center; align-items: center; gap: 5px; border-radius: 10px; }
  .tab.active { color: var(--text-main); background: var(--glass-bg); border: 1px solid var(--glass-border); }

  /* Teams */
  .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
  .team-card { padding: 1.25rem 1rem; text-align: center; transition: 0.3s ease; }
  .team-card.winner { border-color: var(--primary); box-shadow: 0 0 20px var(--primary-glow); }
  .team-name-input { width: 100%; background: transparent; border: none; border-bottom: 1px dashed var(--text-muted); color: var(--text-main); font-size: 16px; font-weight: 700; text-align: center; font-family: inherit; padding-bottom: 4px; margin-bottom: 15px; outline: none; transition: 0.3s; }
  .team-name-input:focus { border-bottom-color: var(--primary); }
  .total { font-size: 56px; font-weight: 800; line-height: 1; text-shadow: 0 4px 12px rgba(0,0,0,0.3); transition: color 0.3s; margin-bottom: 15px; }
  .winner .total { color: var(--primary); }
  .progress-bg { width: 100%; height: 6px; background: rgba(0,0,0,0.3); border-radius: 10px; margin: 0 0 15px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--primary)); width: 0%; transition: width 0.8s cubic-bezier(0.25,0.8,0.25,1); }
  .inp-row { display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(0,0,0,0.2); padding: 6px; border-radius: 12px; }
  .inp-row button { width: 36px; height: 36px; border: none; border-radius: 8px; background: var(--glass-bg); color: var(--text-main); font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
  .inp-row button:active { transform: scale(0.9); }
  .set-inp { width: 45px; text-align: center; font-size: 18px; font-weight: 700; border: none; background: transparent; color: var(--text-main); font-family: inherit; outline: none; }

  /* Player select */
  .player-select-section { margin-bottom: 1.5rem; }
  .player-teams-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .player-team-col { background: rgba(0,0,0,0.15); border-radius: 14px; padding: 10px; border: 1px solid var(--glass-border); }
  .player-team-label { font-size: 12px; color: var(--text-muted); font-weight: 700; margin-bottom: 8px; text-align: center; }
  .player-chip { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
  .player-chip button { background: transparent; border: none; color: var(--danger); cursor: pointer; font-size: 16px; }
  .add-player-btn { width: 100%; padding: 8px; background: rgba(16,185,129,0.1); border: 1px dashed var(--primary); border-radius: 8px; color: var(--primary); font-size: 13px; font-family: inherit; cursor: pointer; font-weight: 600; }

  /* Player Picker */
  .player-picker { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); z-index: 1000; display: none; align-items: flex-end; justify-content: center; padding: 1rem; }
  .player-picker-box { width: 100%; max-width: 500px; background: #1e293b; border-radius: 20px 20px 16px 16px; padding: 1.5rem; border: 1px solid var(--glass-border); max-height: 70vh; overflow-y: auto; }
  .player-picker-title { font-size: 16px; font-weight: 700; margin-bottom: 1rem; text-align: center; }
  .player-list-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border); margin-bottom: 8px; }
  .player-list-item span { font-size: 15px; font-weight: 600; }
  .pick-btn { background: var(--primary); border: none; color: white; border-radius: 8px; padding: 6px 14px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .picker-cancel { width: 100%; margin-top: 10px; padding: 12px; background: rgba(255,255,255,0.05); border: none; border-radius: 12px; color: var(--text-muted); font-size: 14px; font-family: inherit; cursor: pointer; }

  /* FAB */
  .fab-container { position: fixed; bottom: 25px; left: 0; width: 100%; display: flex; justify-content: center; pointer-events: none; z-index: 100; }
  .fab { pointer-events: auto; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; border-radius: 30px; padding: 14px 32px; font-size: 16px; font-weight: 700; font-family: inherit; display: flex; align-items: center; gap: 10px; cursor: pointer; box-shadow: 0 8px 25px var(--primary-glow); transition: 0.3s; }
  .fab:active { transform: scale(0.95) translateY(2px); }
  .fab svg { width: 20px; height: 20px; fill: currentColor; }

  /* Controls */
  .controls { display: flex; gap: 10px; margin-bottom: 2rem; }
  .ctrl-btn { flex: 1; padding: 12px; border: 1px solid var(--glass-border); border-radius: 14px; background: rgba(0,0,0,0.2); color: var(--text-muted); font-size: 14px; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
  .ctrl-btn:active { transform: scale(0.97); }
  .ctrl-btn.danger { color: #fca5a5; }
  .ctrl-btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  /* Sets */
  .sec-title { font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .sec-title::before { content: ''; display: block; width: 4px; height: 16px; background: var(--primary); border-radius: 4px; }
  .sets-list { background: rgba(0,0,0,0.1); border-radius: 16px; overflow: hidden; border: 1px solid var(--glass-border); }
  .round-row { display: grid; grid-template-columns: 60px 1fr 1fr; padding: 12px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; font-size: 14px; }
  .round-row:last-child { border-bottom: none; }
  .rounds-header { background: rgba(255,255,255,0.05); font-weight: 700; font-size: 12px; color: var(--text-muted); }
  .rn { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; }
  .score-val { font-weight: 700; }
  .running { display: block; font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .winner-msg { text-align: center; padding: 16px; background: rgba(16,185,129,0.1); border: 1px solid var(--primary); border-radius: 16px; color: var(--primary); font-size: 16px; font-weight: 700; margin-bottom: 1.5rem; animation: popIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275); }

  /* Modal */
  .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 999; display: none; align-items: center; justify-content: center; padding: 1rem; }
  .confirm-box { width: 100%; max-width: 320px; padding: 1.5rem; text-align: center; animation: slideUp 0.3s ease; }
  .confirm-box p { font-size: 15px; margin-bottom: 1.5rem; line-height: 1.6; white-space: pre-line; }
  .confirm-btns { display: flex; gap: 10px; }
  .confirm-btns button { flex: 1; padding: 10px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; }
  .confirm-btns .yes { background: var(--danger); color: white; }
  .confirm-btns .no { background: rgba(255,255,255,0.1); color: var(--text-main); }

  /* History */
  .chart-container { padding: 1.5rem; margin-bottom: 1.5rem; display: flex; flex-direction: column; gap: 12px; }
  .chart-bar-wrap { display: flex; align-items: center; gap: 10px; }
  .chart-label { width: 70px; font-size: 13px; font-weight: 600; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chart-track { flex: 1; height: 24px; background: rgba(0,0,0,0.3); border-radius: 12px; overflow: hidden; }
  .chart-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--primary)); border-radius: 12px; transition: width 1s ease; }
  .game-card { padding: 1rem; margin-bottom: 1rem; border-right: 4px solid transparent; position: relative; }
  .game-card.win-0 { border-right-color: var(--primary); }
  .game-card.win-1 { border-right-color: var(--accent); }
  .game-card-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px dashed var(--glass-border); }
  .game-score-row { display: flex; align-items: center; justify-content: space-between; }
  .team-block { text-align: center; flex: 1; }
  .tname { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .tscore { font-size: 24px; font-weight: 800; }
  .gwinner .tscore { color: var(--primary); }
  .vs-badge { background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 20px; font-size: 11px; color: var(--text-muted); }
  .empty { text-align: center; color: var(--text-muted); padding: 2rem; font-size: 14px; opacity: 0.7; }

  /* Delete btn — فقط ادمین */
  .delete-game-btn { display: none; position: absolute; left: 10px; top: 10px; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: var(--danger); border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .admin-mode .delete-game-btn { display: block; }

  /* Stats */
  .stats-player-card { padding: 1rem 1.25rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .stats-player-card:active { transform: scale(0.98); }
  .stats-player-name { font-size: 16px; font-weight: 700; }
  .stats-player-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .stats-badge { background: rgba(16,185,129,0.15); color: var(--primary); border-radius: 20px; padding: 4px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .stats-detail { padding: 1.25rem; margin-bottom: 1rem; }
  .stats-detail-header { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; }
  .back-btn { background: transparent; border: none; color: var(--primary); cursor: pointer; font-size: 22px; padding: 0; }
  .stats-detail-name { font-size: 18px; font-weight: 800; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 1.25rem; }
  .stat-box { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 12px; text-align: center; }
  .stat-box-val { font-size: 28px; font-weight: 800; color: var(--primary); }
  .stat-box-lbl { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .partner-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 10px; background: rgba(0,0,0,0.15); margin-bottom: 6px; }
  .partner-name { font-size: 14px; font-weight: 600; }
  .partner-stat { font-size: 12px; color: var(--text-muted); }
  .partner-wins { font-size: 13px; font-weight: 700; color: var(--primary); }

  /* Admin */
  .admin-panel { padding: 1.25rem; margin-bottom: 1rem; }
  .admin-panel-title { font-size: 16px; font-weight: 700; margin-bottom: 1rem; }
  .admin-input-row { display: flex; gap: 8px; margin-bottom: 1rem; }
  .admin-input { flex: 1; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 10px; padding: 10px 14px; color: var(--text-main); font-size: 14px; font-family: inherit; outline: none; }
  .admin-input:focus { border-color: var(--primary); }
  .admin-add-btn { background: var(--primary); border: none; border-radius: 10px; color: white; padding: 10px 16px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; white-space: nowrap; }
  /* لیست بازیکن‌های ادمین با اسکرول */
  .admin-players-scroll { max-height: 320px; overflow-y: auto; margin-bottom: 0.5rem; }
  .admin-player-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 10px; background: rgba(0,0,0,0.15); margin-bottom: 6px; gap: 8px; }
  .admin-player-name { font-size: 14px; font-weight: 600; flex: 1; }
  .admin-edit-input { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--primary); border-radius: 8px; padding: 4px 10px; color: var(--text-main); font-size: 14px; font-family: inherit; outline: none; }
  .admin-row-btns { display: flex; gap: 6px; }
  .admin-edit-btn { background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3); color: var(--accent); border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .admin-save-btn { background: rgba(16,185,129,0.2); border: 1px solid var(--primary); color: var(--primary); border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .admin-del-btn { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: var(--danger); border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .admin-logout { width: 100%; margin-top: 1rem; padding: 10px; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 10px; color: #fca5a5; font-family: inherit; font-size: 14px; cursor: pointer; }

  /* Login */
  .login-box { padding: 2rem 1.5rem; text-align: center; max-width: 300px; margin: 2rem auto 0; }
  .login-title { font-size: 18px; font-weight: 700; margin-bottom: 1.5rem; }
  .login-input { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 12px; padding: 12px 16px; color: var(--text-main); font-size: 16px; font-family: inherit; outline: none; margin-bottom: 12px; text-align: center; }
  .login-input:focus { border-color: var(--primary); }
  .login-btn { width: 100%; padding: 12px; background: var(--primary); border: none; border-radius: 12px; color: white; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; }
  .login-err { color: var(--danger); font-size: 13px; margin-top: 8px; min-height: 20px; }

  .loading { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 14px; }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--glass-border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; margin-left: 8px; vertical-align: middle; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes slideUp { 0% { transform: translateY(20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
</style>
</head>
<body>
<div class="app-container">
  <header>
    <h1>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary)"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
      چهار برگ 🃏
    </h1>
    <div class="subtitle" id="game-subtitle">بازی اول</div>
    <button class="admin-icon" onclick="showTab('admin')" title="ادمین">⚙️</button>
  </header>

  <div class="tab-bar">
    <button class="tab active" id="tab-current" onclick="showTab('current')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      جاری
    </button>
    <button class="tab" id="tab-history" onclick="showTab('history')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
      تاریخچه
    </button>
    <button class="tab" id="tab-stats" onclick="showTab('stats')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      آمار
    </button>
  </div>

  <!-- جاری -->
  <div id="view-current">
    <div id="winner-msg" style="display:none" class="winner-msg glass"></div>
    <div class="player-select-section">
      <div class="sec-title">بازیکن‌های این بازی</div>
      <div class="player-teams-grid">
        <div class="player-team-col">
          <div class="player-team-label" id="label-team0">تیم ما</div>
          <div id="team0-players"></div>
          <button class="add-player-btn" onclick="openPicker(0)">+ افزودن</button>
        </div>
        <div class="player-team-col">
          <div class="player-team-label" id="label-team1">تیم حریف</div>
          <div id="team1-players"></div>
          <button class="add-player-btn" onclick="openPicker(1)">+ افزودن</button>
        </div>
      </div>
    </div>
    <div class="teams">
      <div class="team-card glass" id="card-0">
        <input class="team-name-input" id="name-0" value="تیم ما" oninput="renderGame();document.getElementById('label-team0').textContent=this.value||'تیم ما'">
        <div class="total" id="total-0" data-val="0">0</div>
        <div class="progress-bg"><div class="progress-fill" id="prog-0"></div></div>
        <div class="inp-row">
          <button onclick="adj(0,-5)">−</button>
          <input class="set-inp" id="inp-0" type="number" value="0" step="5" onfocus="this.select()">
          <button onclick="adj(0,5)">+</button>
        </div>
      </div>
      <div class="team-card glass" id="card-1">
        <input class="team-name-input" id="name-1" value="تیم حریف" oninput="renderGame();document.getElementById('label-team1').textContent=this.value||'تیم حریف'">
        <div class="total" id="total-1" data-val="0">0</div>
        <div class="progress-bg"><div class="progress-fill" id="prog-1"></div></div>
        <div class="inp-row">
          <button onclick="adj(1,-5)">−</button>
          <input class="set-inp" id="inp-1" type="number" value="0" step="5" onfocus="this.select()">
          <button onclick="adj(1,5)">+</button>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" onclick="undoSet()">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        برگشت ست
      </button>
      <button class="ctrl-btn danger" onclick="askReset()">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        ریست بازی
      </button>
    </div>
    <div class="sec-title">تاریخچه ست‌ها</div>
    <div class="sets-list" id="sets-list"></div>
  </div>

  <!-- تاریخچه -->
  <div id="view-history" style="display:none">
    <div id="overall-section"></div>
    <div class="sec-title" style="margin-top:1.5rem">ریز نتایج بازی‌ها</div>
    <div id="games-list"></div>
  </div>

  <!-- آمار -->
  <div id="view-stats" style="display:none">
    <div id="stats-list-view">
      <div class="sec-title">آمار بازیکن‌ها</div>
      <div id="stats-players-container"><div class="loading"><span class="spinner"></span> در حال بارگذاری...</div></div>
    </div>
    <div id="stats-detail-view" style="display:none"></div>
  </div>

  <!-- ادمین -->
  <div id="view-admin" style="display:none">
    <div id="admin-login-view">
      <div class="login-box glass">
        <div class="login-title">🔐 ورود ادمین</div>
        <input class="login-input" type="password" id="admin-pass-input" placeholder="رمز عبور" onkeydown="if(event.key==='Enter')doAdminLogin()">
        <button class="login-btn" onclick="doAdminLogin()">ورود</button>
        <div class="login-err" id="login-err"></div>
      </div>
    </div>
    <div id="admin-panel-view" style="display:none">
      <div class="admin-panel glass">
        <div class="admin-panel-title">👥 مدیریت بازیکن‌ها</div>
        <div class="admin-input-row">
          <input class="admin-input" id="new-player-name" placeholder="نام بازیکن جدید" onkeydown="if(event.key==='Enter')addPlayer()">
          <button class="admin-add-btn" onclick="addPlayer()">افزودن</button>
        </div>
        <div class="admin-players-scroll" id="admin-players-list">
          <div class="loading"><span class="spinner"></span></div>
        </div>
        <button class="admin-logout" onclick="adminLogout()">🚪 خروج از ادمین</button>
      </div>
    </div>
  </div>
</div>

<!-- FAB -->
<div class="fab-container" id="fab-container">
  <button class="fab" id="fab-action" onclick="handleFabClick()">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    <span id="fab-text">ثبت امتیاز ست</span>
  </button>
</div>

<!-- Confirm Modal -->
<div class="overlay" id="modal-overlay">
  <div class="confirm-box glass">
    <p id="confirm-text"></p>
    <div class="confirm-btns">
      <button class="yes" id="confirm-yes">بله، مطمئنم</button>
      <button class="no" onclick="cancelConfirm()">انصراف</button>
    </div>
  </div>
</div>

<!-- Player Picker -->
<div class="player-picker" id="player-picker">
  <div class="player-picker-box">
    <div class="player-picker-title" id="picker-title">انتخاب بازیکن</div>
    <div id="picker-list"></div>
    <button class="picker-cancel" onclick="closePicker()">انصراف</button>
  </div>
</div>

<script>
const API = 'https://4bargh-api.zulair.workers.dev';
const WIN = 104;
const state = {
  scores:[0,0], sets:[], gameOver:false, gameNum:1,
  teamPlayers:[[],[]], adminPassword:null, isAdmin:false
};
let allPlayers = [];
let pickerTeam = 0;

function toFa(n){return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);}
function name(i){return document.getElementById('name-'+i).value.trim()||'تیم '+(i+1);}

function animateValue(obj,start,end,dur){
  let t0=null;
  const step=(t)=>{
    if(!t0)t0=t;
    const p=Math.min((t-t0)/dur,1);
    const e=1-Math.pow(1-p,4);
    obj.innerHTML=Math.floor(e*(end-start)+start);
    if(p<1)requestAnimationFrame(step);
    else{obj.innerHTML=end;obj.dataset.val=end;}
  };
  requestAnimationFrame(step);
}

function adj(i,d){
  const inp=document.getElementById('inp-'+i);
  inp.value=Math.max(0,(parseInt(inp.value)||0)+d);
}

// ── API ────────────────────────────────────────────
async function apiGet(path){
  const r=await fetch(API+path);
  return r.json();
}
async function apiPost(path,body){
  const h={'Content-Type':'application/json'};
  if(state.adminPassword)h['X-Admin-Password']=state.adminPassword;
  const r=await fetch(API+path,{method:'POST',headers:h,body:JSON.stringify(body)});
  return r.json();
}
async function apiPut(path,body){
  const h={'Content-Type':'application/json'};
  if(state.adminPassword)h['X-Admin-Password']=state.adminPassword;
  const r=await fetch(API+path,{method:'PUT',headers:h,body:JSON.stringify(body)});
  return r.json();
}
async function apiDelete(path){
  const h={};
  if(state.adminPassword)h['X-Admin-Password']=state.adminPassword;
  const r=await fetch(API+path,{method:'DELETE',headers:h});
  return r.json();
}

// ── Players ────────────────────────────────────────
async function loadPlayers(){
  try{allPlayers=await apiGet('/players');}catch(e){allPlayers=[];}
  renderTeamPlayers();
}

function renderTeamPlayers(){
  [0,1].forEach(t=>{
    const el=document.getElementById('team'+t+'-players');
    el.innerHTML=state.teamPlayers[t].map(p=>
      `<div class="player-chip"><span>${p.name}</span><button onclick="removePlayer(${t},${p.id})">×</button></div>`
    ).join('');
  });
}

function removePlayer(team,id){
  state.teamPlayers[team]=state.teamPlayers[team].filter(p=>p.id!==id);
  renderTeamPlayers();
}

function openPicker(team){
  pickerTeam=team;
  document.getElementById('picker-title').textContent=`انتخاب بازیکن برای ${name(team)}`;
  const already=[...state.teamPlayers[0],...state.teamPlayers[1]].map(p=>p.id);
  const available=allPlayers.filter(p=>!already.includes(p.id));
  const list=document.getElementById('picker-list');
  if(!available.length){
    list.innerHTML='<div class="empty">بازیکنی باقی نمانده<br><small>از پنل ادمین بازیکن اضافه کنید</small></div>';
  } else {
    list.innerHTML=available.map(p=>
      `<div class="player-list-item"><span>${p.name}</span><button class="pick-btn" onclick="pickPlayer(${p.id},'${p.name.replace(/'/g,"\\'").replace(/"/g,"&quot;")}')">انتخاب</button></div>`
    ).join('');
  }
  document.getElementById('player-picker').style.display='flex';
}

function pickPlayer(id,pname){
  state.teamPlayers[pickerTeam].push({id,name:pname});
  renderTeamPlayers();
  closePicker();
}
function closePicker(){document.getElementById('player-picker').style.display='none';}

// ── Game ───────────────────────────────────────────
function handleFabClick(){
  if(state.gameOver){askSaveGame();}
  else{
    const v=[0,1].map(i=>Math.max(0,parseInt(document.getElementById('inp-'+i).value)||0));
    if(v[0]===0&&v[1]===0)return;
    showConfirm(`ثبت ست؟\n${name(0)}: ${v[0]} | ${name(1)}: ${v[1]}`,()=>{cancelConfirm();addSet();});
  }
}

function addSet(){
  if(state.gameOver)return;
  const v=[0,1].map(i=>Math.max(0,parseInt(document.getElementById('inp-'+i).value)||0));
  if(v[0]===0&&v[1]===0)return;
  state.sets.push([...v]);
  state.scores[0]+=v[0];state.scores[1]+=v[1];
  document.getElementById('inp-0').value=0;document.getElementById('inp-1').value=0;
  if(state.scores[0]>=WIN||state.scores[1]>=WIN)state.gameOver=true;
  renderGame(true);
}

function undoSet(){
  if(!state.sets.length)return;
  const last=state.sets.pop();
  state.scores[0]-=last[0];state.scores[1]-=last[1];
  state.gameOver=false;renderGame(true);
}

function getWinIdx(){
  if(!state.gameOver)return -1;
  if(state.scores[0]>=WIN&&state.scores[1]>=WIN)return state.scores[0]>state.scores[1]?0:1;
  return state.scores[0]>=WIN?0:1;
}

function askReset(){showConfirm('آیا مطمئن هستید؟\nبازی جاری ریست می‌شود.',doReset);}
function doReset(){
  state.scores=[0,0];state.sets=[];state.gameOver=false;state.teamPlayers=[[],[]];
  document.getElementById('inp-0').value=0;document.getElementById('inp-1').value=0;
  cancelConfirm();renderGame(true);renderTeamPlayers();
}

function askSaveGame(){showConfirm('نتیجه ذخیره شود و\nبازی جدید شروع شود؟',doSaveGame);}
async function doSaveGame(){
  cancelConfirm();
  const wi=getWinIdx();
  const t1=state.teamPlayers[0].map(p=>p.id);
  const t2=state.teamPlayers[1].map(p=>p.id);
  if(t1.length&&t2.length){
    try{await apiPost('/games',{team1:t1,team2:t2,team1_score:state.scores[0],team2_score:state.scores[1],winner:wi+1});}
    catch(e){console.error(e);}
  }
  state.gameNum++;
  state.scores=[0,0];state.sets=[];state.gameOver=false;state.teamPlayers=[[],[]];
  document.getElementById('inp-0').value=0;document.getElementById('inp-1').value=0;
  renderGame(true);renderTeamPlayers();
}

function renderGame(animate=false){
  const wi=getWinIdx();
  [0,1].forEach(i=>{
    const el=document.getElementById('total-'+i);
    const old=parseInt(el.dataset.val)||0;
    if(animate&&old!==state.scores[i])animateValue(el,old,state.scores[i],600);
    else{el.textContent=state.scores[i];el.dataset.val=state.scores[i];}
    document.getElementById('card-'+i).className='team-card glass'+(wi===i?' winner':'');
    document.getElementById('prog-'+i).style.width=Math.min(100,(state.scores[i]/WIN)*100)+'%';
  });
  const wm=document.getElementById('winner-msg');
  const fab=document.getElementById('fab-action');
  if(wi>=0){
    wm.style.display='block';
    wm.innerHTML=`🎉 تبریک! <strong>${name(wi)}</strong> برنده بازی ${toFa(state.gameNum)} شد.`;
    fab.style.background='linear-gradient(135deg,#3b82f6,#2563eb)';
    document.getElementById('fab-text').textContent='ذخیره و بازی جدید';
    fab.querySelector('svg').innerHTML='<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>';
  } else {
    wm.style.display='none';
    fab.style.background='linear-gradient(135deg,#10b981,#059669)';
    document.getElementById('fab-text').textContent='ثبت امتیاز ست';
    fab.querySelector('svg').innerHTML='<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>';
  }
  document.getElementById('game-subtitle').textContent='بازی '+toFa(state.gameNum);
  const list=document.getElementById('sets-list');
  if(!state.sets.length){list.innerHTML='<div class="empty">هنوز ستی ثبت نشده است</div>';return;}
  let cum=[0,0];
  list.innerHTML=`<div class="round-row rounds-header"><span></span><span>${name(0)}</span><span>${name(1)}</span></div>`
    +state.sets.map((s,i)=>{
      cum[0]+=s[0];cum[1]+=s[1];
      return `<div class="round-row"><span class="rn">ست ${toFa(i+1)}</span>
        <span><span class="score-val">${s[0]}</span><span class="running">${cum[0]}</span></span>
        <span><span class="score-val">${s[1]}</span><span class="running">${cum[1]}</span></span></div>`;
    }).reverse().join('');
}

// ── History ────────────────────────────────────────
async function renderHistory(){
  const glist=document.getElementById('games-list');
  const osec=document.getElementById('overall-section');
  glist.innerHTML='<div class="loading"><span class="spinner"></span> در حال بارگذاری...</div>';
  let games=[];
  try{games=await apiGet('/games');}catch(e){}
  if(!games.length){glist.innerHTML='<div class="empty glass">تاریخچه‌ای موجود نیست</div>';osec.innerHTML='';return;}

  const totals={};let maxWins=0;
  games.forEach(g=>{
    [1,2].forEach(t=>{
      (g.players||[]).filter(p=>p.team===t).forEach(p=>{
        if(!totals[p.name])totals[p.name]={wins:0};
        if(g.winner===t){totals[p.name].wins++;if(totals[p.name].wins>maxWins)maxWins=totals[p.name].wins;}
      });
    });
  });
  const sorted=Object.entries(totals).sort((a,b)=>b[1].wins-a[1].wins);
  osec.innerHTML=`<div class="chart-container glass">
    <div class="sec-title" style="margin-bottom:5px">نمودار بردها</div>
    ${sorted.map(([n,d])=>`<div class="chart-bar-wrap">
      <div class="chart-label">${n}</div>
      <div class="chart-track"><div class="chart-fill" style="width:${maxWins?(d.wins/maxWins*100):0}%"></div></div>
      <div style="font-size:12px;font-weight:700;width:40px">${toFa(d.wins)} برد</div>
    </div>`).join('')}
  </div>`;

  const adminClass=state.isAdmin?'admin-mode':'';
  glist.innerHTML=games.map(g=>{
    const t1=(g.players||[]).filter(p=>p.team===1).map(p=>p.name).join('، ')||'—';
    const t2=(g.players||[]).filter(p=>p.team===2).map(p=>p.name).join('، ')||'—';
    const winTeam=g.winner===1?t1:t2;
    let d='';
    try{d=new Date(g.played_at).toLocaleDateString('fa-IR');}catch(e){}
    return `<div class="game-card glass win-${g.winner-1} ${adminClass}">
      <button class="delete-game-btn" onclick="askDeleteGame(${g.id})">🗑 حذف</button>
      <div class="game-card-header"><span>${d}</span><span style="color:var(--primary)">${winTeam} برد</span></div>
      <div class="game-score-row">
        <div class="team-block ${g.winner===1?'gwinner':''}">
          <div class="tname">${t1} ${g.winner===1?'👑':''}</div>
          <div class="tscore">${g.team1_score}</div>
        </div>
        <div class="vs-badge">VS</div>
        <div class="team-block ${g.winner===2?'gwinner':''}">
          <div class="tname">${t2} ${g.winner===2?'👑':''}</div>
          <div class="tscore">${g.team2_score}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function askDeleteGame(id){
  showConfirm('آیا از حذف این بازی\nمطمئن هستید؟',async()=>{
    cancelConfirm();
    await apiDelete('/games/'+id);
    renderHistory();
  });
}

// ── Stats ──────────────────────────────────────────
async function renderStats(){
  const container=document.getElementById('stats-players-container');
  container.innerHTML='<div class="loading"><span class="spinner"></span> در حال بارگذاری...</div>';
  document.getElementById('stats-list-view').style.display='block';
  document.getElementById('stats-detail-view').style.display='none';
  if(!allPlayers.length){
    try{allPlayers=await apiGet('/players');}catch(e){}
  }
  if(!allPlayers.length){
    container.innerHTML='<div class="empty glass">هنوز بازیکنی ثبت نشده<br><small>از پنل ادمین بازیکن اضافه کنید</small></div>';
    return;
  }
  const statsArr=await Promise.all(allPlayers.map(p=>apiGet('/stats/'+p.id).catch(()=>({total_games:0,wins:0,losses:0,partners:[]}))));
  container.innerHTML='';
  allPlayers.forEach((p,i)=>{
    const s=statsArr[i];
    const wr=s.total_games?Math.round((s.wins/s.total_games)*100):0;
    const div=document.createElement('div');
    div.className='stats-player-card glass';
    div.innerHTML=`<div>
      <div class="stats-player-name">${p.name}</div>
      <div class="stats-player-meta">${toFa(s.total_games||0)} بازی | ${toFa(s.wins||0)} برد | ${toFa(s.losses||0)} باخت</div>
    </div><div class="stats-badge">${wr}%</div>`;
    div.onclick=()=>showPlayerDetail(p,s);
    container.appendChild(div);
  });
}

function showPlayerDetail(player,stats){
  document.getElementById('stats-list-view').style.display='none';
  const detail=document.getElementById('stats-detail-view');
  detail.style.display='block';
  const wr=stats.total_games?Math.round((stats.wins/stats.total_games)*100):0;
  const partners=stats.partners||[];
  detail.innerHTML=`<div class="stats-detail glass">
    <div class="stats-detail-header">
      <button class="back-btn" onclick="document.getElementById('stats-list-view').style.display='block';document.getElementById('stats-detail-view').style.display='none'">←</button>
      <div class="stats-detail-name">${player.name}</div>
    </div>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-box-val">${toFa(stats.wins||0)}</div><div class="stat-box-lbl">برد</div></div>
      <div class="stat-box"><div class="stat-box-val">${toFa(stats.losses||0)}</div><div class="stat-box-lbl">باخت</div></div>
      <div class="stat-box"><div class="stat-box-val">${wr}%</div><div class="stat-box-lbl">درصد برد</div></div>
    </div>
    ${partners.length?`<div class="sec-title">آمار با شریک‌های تیمی</div>
    ${partners.map(p=>`<div class="partner-row">
      <div><div class="partner-name">${p.partner_name}</div>
      <div class="partner-stat">${toFa(p.together)} بازی با هم</div></div>
      <div class="partner-wins">${toFa(p.wins_together)} برد</div>
    </div>`).join('')}`:'<div class="empty">هنوز بازی ثبت‌شده‌ای نیست</div>'}
  </div>`;
}

// ── Admin ──────────────────────────────────────────
async function doAdminLogin(){
  const pass=document.getElementById('admin-pass-input').value;
  if(!pass)return;
  // تست رمز با یه درخواست واقعی
  const testH={'Content-Type':'application/json','X-Admin-Password':pass};
  try{
    const r=await fetch(API+'/players',{method:'POST',headers:testH,body:JSON.stringify({name:'__test__'})});
    const d=await r.json();
    if(d.error==='Unauthorized'){
      document.getElementById('login-err').textContent='رمز اشتباه است';
      return;
    }
    // اگه ساخته شد، پاکش کن
    if(d.ok){
      const pl=await apiGet('/players');
      const t=pl.find(p=>p.name==='__test__');
      if(t){await fetch(API+'/players/'+t.id,{method:'DELETE',headers:{'X-Admin-Password':pass}});}
    }
  }catch(e){}
  state.adminPassword=pass;
  state.isAdmin=true;
  document.getElementById('login-err').textContent='';
  document.getElementById('admin-login-view').style.display='none';
  document.getElementById('admin-panel-view').style.display='block';
  loadAdminPlayers();
}

function adminLogout(){
  state.adminPassword=null;state.isAdmin=false;
  document.getElementById('admin-login-view').style.display='block';
  document.getElementById('admin-panel-view').style.display='none';
  document.getElementById('admin-pass-input').value='';
  showTab('current');
}

async function loadAdminPlayers(){
  const list=document.getElementById('admin-players-list');
  list.innerHTML='<div class="loading"><span class="spinner"></span></div>';
  try{allPlayers=await apiGet('/players');}catch(e){allPlayers=[];}
  if(!allPlayers.length){list.innerHTML='<div class="empty">هنوز بازیکنی ثبت نشده</div>';return;}
  list.innerHTML=allPlayers.map(p=>
    `<div class="admin-player-row" id="row-${p.id}">
      <span class="admin-player-name" id="name-label-${p.id}">${p.name}</span>
      <input class="admin-edit-input" id="edit-inp-${p.id}" value="${p.name}" style="display:none" onkeydown="if(event.key==='Enter')savePlayer(${p.id})">
      <div class="admin-row-btns">
        <button class="admin-edit-btn" id="edit-btn-${p.id}" onclick="startEdit(${p.id})">✏️ ویرایش</button>
        <button class="admin-save-btn" id="save-btn-${p.id}" style="display:none" onclick="savePlayer(${p.id})">✓ ذخیره</button>
        <button class="admin-del-btn" onclick="deletePlayer(${p.id})">🗑</button>
      </div>
    </div>`
  ).join('');
}

function startEdit(id){
  document.getElementById('name-label-'+id).style.display='none';
  document.getElementById('edit-inp-'+id).style.display='block';
  document.getElementById('edit-btn-'+id).style.display='none';
  document.getElementById('save-btn-'+id).style.display='block';
  document.getElementById('edit-inp-'+id).focus();
}

async function savePlayer(id){
  const newName=document.getElementById('edit-inp-'+id).value.trim();
  if(!newName)return;
  await apiPut('/players/'+id,{name:newName});
  loadAdminPlayers();
  loadPlayers();
}

async function addPlayer(){
  const inp=document.getElementById('new-player-name');
  const n=inp.value.trim();
  if(!n)return;
  inp.value='';
  await apiPost('/players',{name:n});
  loadAdminPlayers();
  allPlayers=await apiGet('/players');
}

async function deletePlayer(id){
  showConfirm('آیا از حذف این بازیکن\nمطمئن هستید؟',async()=>{
    cancelConfirm();
    await apiDelete('/players/'+id);
    loadAdminPlayers();
    allPlayers=await apiGet('/players');
  });
}

// ── Tabs ───────────────────────────────────────────
function showTab(t){
  ['current','history','stats','admin'].forEach(tab=>{
    document.getElementById('view-'+tab).style.display=tab===t?'block':'none';
    const btn=document.getElementById('tab-'+tab);
    if(btn)btn.className='tab'+(tab===t?' active':'');
  });
  document.getElementById('fab-container').style.display=t==='current'?'flex':'none';
  if(t==='history')renderHistory();
  if(t==='stats')renderStats();
  if(t==='admin'&&state.isAdmin){
    document.getElementById('admin-login-view').style.display='none';
    document.getElementById('admin-panel-view').style.display='block';
    loadAdminPlayers();
  }
}

// ── Confirm ────────────────────────────────────────
function showConfirm(text,action){
  document.getElementById('confirm-text').textContent=text;
  document.getElementById('confirm-yes').onclick=action;
  document.getElementById('modal-overlay').style.display='flex';
}
function cancelConfirm(){document.getElementById('modal-overlay').style.display='none';}

// ── Init ───────────────────────────────────────────
renderGame();
loadPlayers();
</script>
</body>
</html>
